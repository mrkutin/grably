name: grably

options:
  bundleIdPrefix: com.grably
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: "" # TODO: set your Apple Developer Team ID
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: grably.entitlements
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.grably.app

packages:
  GrablyCore:
    path: Packages/GrablyCore

targets:
  grably:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/App
      - path: Resources/Assets.xcassets
      # Folder reference: copies the whole `bin` directory verbatim into
      # Contents/Resources/bin, preserving structure so BinaryProvisioner can
      # resolve Bundle.main/Contents/Resources/bin at runtime.
      - path: Resources/bin
        type: folder
        buildPhase: resources
    dependencies:
      - package: GrablyCore
        product: GrablyCore
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: Grably
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundlePackageType: APPL
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: grably.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.grably.app
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
